                const target = (a.getAttribute('target') || '').toLowerCase();

                }

                    const label = (a.textContent || '').trim() || href;
                    try { window.ubicatecTrack && window.ubicatecTrack('jornadas_link_click', { label }); } catch {}
                }
            }, true);
        });
